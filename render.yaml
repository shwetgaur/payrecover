services:
  - type: web
    name: payrecover-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: payrecover-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: payrecover-db
    plan: free
